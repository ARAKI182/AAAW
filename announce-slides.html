<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ANY AND ALL WIND — 配信告知スライド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Shippori+Mincho:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#05171c;overflow:hidden}
#stage{
  position:relative;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:
    radial-gradient(60% 50% at 50% 46%, rgba(231,207,142,.10), transparent 60%),
    radial-gradient(120% 90% at 70% -10%, rgba(67,208,236,.10), transparent 55%),
    linear-gradient(180deg,#0c2f37 0%,#082026 55%,#05151a 100%);
}
#stage::before{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 360px 60px rgba(0,0,0,.55)}
.bar{position:absolute;left:0;right:0;height:66px;background:#000;z-index:30}
.bar.top{top:0}.bar.bot{bottom:0}
#cv{position:absolute;inset:0;z-index:10}
#glow{position:absolute;left:50%;top:46%;width:900px;height:900px;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(231,207,142,.35),transparent 62%);opacity:0;z-index:9;pointer-events:none;filter:blur(8px)}
#crisp{position:absolute;inset:0;z-index:14;pointer-events:none;opacity:0;filter:blur(18px);transition:opacity 3s ease,filter 3s ease}
#crisp.show{opacity:1;filter:blur(0)}
#logo{position:absolute;left:50%;top:42%;width:1080px;transform:translate(-50%,-50%) scale(.8);
  opacity:0;z-index:15;pointer-events:none;
  filter:blur(34px) drop-shadow(0 0 40px rgba(231,207,142,.55));will-change:transform,opacity,filter}
#logo.show{animation:logoIn 1.6s cubic-bezier(.16,.7,.2,1) forwards}
@keyframes logoIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.82);filter:blur(34px) drop-shadow(0 0 40px rgba(231,207,142,.55))}
  55%{opacity:1}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0) drop-shadow(0 0 58px rgba(231,207,142,.5))}
}
#tagline{position:absolute;left:50%;top:74%;transform:translate(-50%,-50%);z-index:15;text-align:center;
  font-family:'Cormorant Garamond',serif;font-weight:500;font-size:40px;letter-spacing:.22em;line-height:1.7;
  color:rgba(244,241,230,.9);opacity:0;transition:opacity 1.2s ease;white-space:nowrap;
  text-shadow:0 0 18px rgba(5,21,26,.8)}
#tagline.show{opacity:1}
#hint{position:absolute;left:40px;bottom:30px;z-index:40;font-family:'Cormorant Garamond',serif;
  font-size:26px;letter-spacing:.12em;color:rgba(244,241,230,.4);transition:opacity .4s}
#hint.hide{opacity:0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="glow"></div>
  <canvas id="crisp" width="1920" height="1080"></canvas>
  <img id="logo" src="img/logo-color.png" alt="ANY AND ALL WIND">
  <div id="tagline">2026.07.08（wed）Release<br>ARAKI × Narukaze<br>9 TRACKS EP ALBUM</div>
  <div class="bar top"></div>
  <div class="bar bot"></div>
  <div id="hint">→ 進む　／　← 戻る　／　F 全画面　／　H ヒント</div>
</div>

<script>
/* ====== 固定キャンバス自動フィット ====== */
const stage = document.getElementById('stage');
function fit() {
  const sc = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = 'scale(' + sc + ')';
  stage.style.marginLeft = ((innerWidth - 1920 * sc) / 2) + 'px';
  stage.style.marginTop = ((innerHeight - 1080 * sc) / 2) + 'px';
}
addEventListener('resize', fit); fit();

/* ====== ステップ定義 ====== */
const CX = 960, CY = 1080 * 0.46;
const STEPS = [
  { type: 'idle' },
  { type: 'text', text: '重大告知', font: "700 230px 'Shippori Mincho'" },
  { type: 'text', text: '2026.07.08 (wed)', font: "500 180px 'Cormorant Garamond'" },
  { type: 'text', text: 'ARAKI × Narukaze', font: "500 158px 'Cormorant Garamond'" },
  { type: 'text', text: '新作EPアルバム', font: "700 205px 'Shippori Mincho'" },
  { type: 'logo' }
];

/* ====== パーティクル ====== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const oc = document.createElement('canvas'); oc.width = 1920; oc.height = 1080;
const octx = oc.getContext('2d', { willReadFrequently: true });
const N = 3200;
const HEX = ['#f4f1e6', '#e7cf8e', '#e7cf8e', '#c9a24a', '#f0e1a0', '#f3a8c4', '#a9e3cf', '#bcb0e6', '#9fd9ec', '#43d0ec'];
const rgb = (h) => { h = h.replace('#', ''); return parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16); };
const COLS = HEX.map(rgb);
let particles = [], ambient = true, t = 0, flashes = [], token = 0, cur = 0;

function initParticles() {
  particles = [];
  for (let i = 0; i < N; i++) {
    particles.push({
      x: Math.random() * 1920, y: Math.random() * 1080,
      vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3,
      tx: 0, ty: 0, active: false,
      a: 0, baseA: Math.random() * .45 + .5,
      sz: Math.random() * 1.3 + 1.1,
      col: COLS[(Math.random() * COLS.length) | 0],
      tw: Math.random() * .018 + .006
    });
  }
}

function fitFont(text, font) {
  octx.font = font; const m = octx.measureText(text).width;
  if (m > 1560) { const px = parseInt(font.match(/(\d+)px/)[1]); return font.replace(/\d+px/, Math.floor(px * 1560 / m) + 'px'); }
  return font;
}
function sampleText(text, font) {
  octx.clearRect(0, 0, 1920, 1080);
  octx.fillStyle = '#fff'; octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.font = font;
  octx.fillText(text, CX, CY);
  const d = octx.getImageData(0, 0, 1920, 1080).data;
  let pts = [], step = 5;
  for (let y = 0; y < 1080; y += step) for (let x = 0; x < 1920; x += step) if (d[(y * 1920 + x) * 4 + 3] > 120) pts.push({ x, y });
  while (pts.length > N * 0.9) { const f = []; for (let i = 0; i < pts.length; i += 2) f.push(pts[i]); pts = f; }
  return pts;
}
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0;[arr[i], arr[j]] = [arr[j], arr[i]]; } }
function burst(p, amt) { p.vx += (Math.random() - .5) * amt; p.vy += (Math.random() - .5) * amt; }
function flash(x, y, r, life) { flashes.push({ x, y, r, age: 0, life }); }

const crisp = document.getElementById('crisp'), cctx = crisp.getContext('2d');
function drawCrisp(text, font) {
  cctx.clearRect(0, 0, 1920, 1080);
  cctx.textAlign = 'center'; cctx.textBaseline = 'middle'; cctx.font = font; cctx.lineJoin = 'round';
  cctx.lineWidth = 9; cctx.strokeStyle = 'rgba(5,21,26,.5)'; cctx.strokeText(text, CX, CY);
  cctx.fillStyle = '#f6f2e6'; cctx.fillText(text, CX, CY);
}
function setText(s, my) {
  ambient = false;
  crisp.classList.remove('show');               // 前の白文字をぼかして消す（内容は残したまま）
  const font = fitFont(s.text, s.font);
  const pts = sampleText(s.text, font);
  const idx = particles.map((_, i) => i); shuffle(idx);
  for (let k = 0; k < particles.length; k++) {
    const p = particles[idx[k]];
    if (k < pts.length) { p.tx = pts[k].x; p.ty = pts[k].y; p.active = true; } else p.active = false;
    burst(p, 34);
  }
  flash(CX, CY, 520, 30);
  setTimeout(() => {                              // 形成＋粒テキストで余韻（2.5秒形成＋2秒ホールド）
    if (my !== token) return;
    drawCrisp(s.text, font);                      // 同座標で整列した白文字を描き
    crisp.style.transition = 'opacity 3s ease, filter 3s ease';  // 3秒かけて
    crisp.classList.add('show');                  // かなりゆっくり浮かび上がる
    ambient = true;                               // 粒はバラけて飛び去り、薄い漂いへ
    for (const p of particles) { p.active = false; p.vx = (Math.random() - .5) * 12; p.vy = -(Math.random() * 6 + 1); }
  }, 4500);
}
function setLogo(my) {
  ambient = false;
  for (const p of particles) { p.tx = CX + (Math.random() - .5) * 230; p.ty = CY + (Math.random() - .5) * 110; p.active = true; burst(p, 26); }
  flash(CX, CY, 360, 26);
  setTimeout(() => {
    if (my !== token) return;
    flash(CX, CY, 780, 44);
    const lg = document.getElementById('logo'); lg.classList.remove('show'); void lg.offsetWidth; lg.classList.add('show');
    setTimeout(() => { if (my === token) document.getElementById('tagline').classList.add('show'); }, 1100);
    for (const p of particles) { p.active = false; p.vx += (Math.random() - .5) * 34; p.vy += (Math.random() - .5) * 34 - 7; }
  }, 1250);
}

/* ====== ステップ適用 ====== */
function apply(i) {
  cur = i; const my = ++token;
  document.getElementById('logo').classList.remove('show'); document.getElementById('logo').style.opacity = 0;
  document.getElementById('tagline').classList.remove('show');
  crisp.style.transition = 'opacity .5s ease, filter .5s ease';  // 古い白文字は速く消す
  crisp.classList.remove('show');
  if (STEPS[i].type === 'idle') { ambient = true; for (const p of particles) { p.active = false; burst(p, 5); } }
  else if (STEPS[i].type === 'text') setText(STEPS[i], my);
  else setLogo(my);
}

/* ====== ループ ====== */
function loop() {
  t++;
  ctx.fillStyle = 'rgba(7,26,31,0.30)'; ctx.fillRect(0, 0, 1920, 1080);
  for (const p of particles) {
    if (p.active) {
      p.vx += (p.tx - p.x) * 0.006; p.vy += (p.ty - p.y) * 0.006;
      p.vx *= 0.9; p.vy *= 0.9; p.x += p.vx; p.y += p.vy;
      p.a += (p.baseA - p.a) * 0.07;
    } else if (ambient) {
      p.vy -= 0.0025; p.vx *= 0.99; p.x += p.vx * 0.4 + Math.sin((p.y + t) * 0.004) * 0.12; p.y += p.vy * 0.4;
      p.a += (p.baseA * 0.32 - p.a) * 0.03;
      if (p.y < -30) { p.x = Math.random() * 1920; p.y = 1110 + Math.random() * 40; p.vx = (Math.random() - .5) * .3; p.vy = -Math.random() * .35 - .1; }
    } else {
      p.vy += 0.02; p.vx *= 0.97; p.x += p.vx; p.y += p.vy; p.a += (0 - p.a) * 0.05;
    }
    if (p.a < 0.012) continue;
    const tw = p.a * (0.8 + 0.2 * Math.sin(t * p.tw + p.x * 0.01));
    ctx.fillStyle = 'rgba(' + p.col + ',' + tw + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'lighter';
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i]; f.age++;
    const pr = f.age / f.life; if (pr >= 1) { flashes.splice(i, 1); continue; }
    const r = (1 - Math.pow(1 - pr, 2)) * f.r, al = (1 - pr) * 0.8;
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    g.addColorStop(0, 'rgba(255,250,228,' + al + ')'); g.addColorStop(0.4, 'rgba(231,207,142,' + (al * 0.5) + ')'); g.addColorStop(1, 'rgba(231,207,142,0)');
    ctx.fillStyle = g; ctx.fillRect(f.x - r, f.y - r, r * 2, r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
  document.getElementById('glow').style.opacity = Math.min(0.9, flashes.reduce((s, f) => s + (1 - f.age / f.life), 0) * 0.5);
  requestAnimationFrame(loop);
}

/* ====== キーボード（数字キーで無音ジャンプも可） ====== */
const hint = document.getElementById('hint');
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (cur < STEPS.length - 1) apply(cur + 1); hint.classList.add('hide'); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (cur > 0) apply(cur - 1); }
  else if (/^[0-9]$/.test(e.key)) { const n = +e.key; if (n < STEPS.length) apply(n); }
  else if (e.key.toLowerCase() === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  else if (e.key.toLowerCase() === 'h') { hint.classList.toggle('hide'); }
});

/* ====== 起動 ====== */
function start() { initParticles(); loop(); }
Promise.all([
  document.fonts.load("700 230px 'Shippori Mincho'"),
  document.fonts.load("500 180px 'Cormorant Garamond'")
]).then(start).catch(start);
setTimeout(() => { if (!particles.length) start(); }, 1500);
</script>
</body>
</html>
